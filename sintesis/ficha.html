<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ficha — Panni Margot</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://acdn-us.mitiendanube.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./base.css">
<style>
/* ═══ FICHA · patrón Demobaza sobre blanco: la foto manda, la data se corre al costado ═══ */

/* migas */
.migas{padding:var(--s-4) 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2) var(--s-3);
  font-family:var(--f-mono);font-size:var(--t-1);letter-spacing:.16em;text-transform:uppercase;color:var(--fg-2);line-height:1.6;min-height:44px}
.migas a{display:inline-flex;align-items:center;min-height:32px;color:var(--fg-2);text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;transition:color var(--dur-fast),text-decoration-color var(--dur-fast)}
.migas a:hover,.migas a:focus-visible{color:var(--fg);text-decoration-color:currentColor}
.migas [lang="ja"]{letter-spacing:0;margin-left:4px}
.migas .sep{color:var(--fg-3)}
.migas [aria-current]{color:var(--fg)}

/* estructura: ensayo (2 col) + data sticky */
.ficha{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,25vw,380px);gap:0 var(--s-16);align-items:start;padding:var(--s-2) 0 var(--s-16)}
/* DOM: data → ensayo → envío (orden de lectura y de foco: nombre, precio, talle, CTA, fotos, servicio);
   en pantalla el ensayo va a la izquierda y la banda de servicio debajo, en su misma columna */
@media (min-width:1024px){
  .data{grid-column:2;grid-row:1 / 3}
  .izq{grid-column:1;grid-row:1}
  .envio{grid-column:1;grid-row:2}
}

/* ── ENSAYO FOTOGRÁFICO ── */
.ensayo{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-3);min-width:0}
/* marco 3/4 uniforme (doctrina del brief §8: la consistencia fotográfica es el diseño); las fotos de TN son 2:3,
   el object-fit:cover recorta un poco de piso por abajo y el 12% ancla la cabeza */
.foto{position:relative;margin:0;aspect-ratio:3/4;overflow:hidden;background:var(--surface-2)}
.foto .pm-img{position:absolute;inset:0;object-position:50% 12%}
/* el ensayo va siempre de a pares desde la primera toma; la única toma sola es la última cuando sobra:
   queda centrada, mismo 3/4 (nunca una toma apaisada que recorte el cuerpo, nunca un hueco) */
.foto.sola{grid-column:1 / -1;width:calc(50% - var(--s-3) / 2);justify-self:center}
.foto .n{position:absolute;right:var(--s-3);bottom:var(--s-2);z-index:2;font-family:var(--f-mono);font-size:var(--t-0);letter-spacing:.16em;color:var(--fg-2);opacity:0;transition:opacity var(--dur-fast)}
@media (hover:hover) and (pointer:fine){
  .foto:hover .pm-img{filter:grayscale(0) contrast(1)}
  .foto:hover .n{opacity:1}
}
/* papel de calco: lupa esmerilada que sigue al puntero sobre el ensayo */
.calco{position:absolute;top:0;left:0;z-index:5;width:240px;height:170px;pointer-events:none;opacity:0;
  border:1px solid var(--fg);background:rgba(255,255,255,.22);
  -webkit-backdrop-filter:blur(2px) grayscale(0);backdrop-filter:blur(2px) grayscale(0);
  transition:opacity var(--dur-fast);will-change:transform;
  font-family:var(--f-mono);font-size:var(--t-0);letter-spacing:.18em;text-transform:uppercase;color:var(--fg)}
.calco.on{opacity:1}
.calco i{position:absolute;top:6px;right:8px;font-style:normal}
.calco span{position:absolute;bottom:6px;left:8px;right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calco::before,.calco::after{content:"";position:absolute;background:var(--fg);opacity:.5}
.calco::before{left:50%;top:0;bottom:0;width:1px}
.calco::after{top:50%;left:0;right:0;height:1px}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){.calco{background:rgba(255,255,255,.7)}}
@media (hover:none),(pointer:coarse){.calco{display:none}}

/* botón de las tomas restantes: al pie del ensayo, alineado a la derecha como el contador */
.ens-mas{display:flex;justify-content:flex-end;padding-top:var(--s-4)}
.ens-mas .lnk{display:inline-flex;align-items:center;min-height:44px}

/* ── DATA DURA · apilada, sin tabs ── */
/* la columna ocupa el alto del ensayo; el bloque sticky termina en el CTA (como Demobaza termina en ADD TO BAG):
   el primer pantallazo cierra limpio en 1440×900. Envío/retiro es la banda de servicio al pie del ensayo. */
.izq{min-width:0}
.data{display:flex;flex-direction:column;align-self:stretch;min-width:0}
.d-stick{position:sticky;top:calc(var(--hd) + var(--s-4));display:flex;flex-direction:column;min-width:0}
/* más alto que la ventana (notebooks bajas): la columna corre con la página y solo el CTA se pega
   al pie de la ventana hasta llegar a su lugar (el botón siempre a mano sin scrollear) */
.d-stick.alta{position:static}
.data>.cta.pie{position:sticky;bottom:0;z-index:3;margin-top:0;padding:var(--s-3) 0 var(--s-6);background:var(--bg)}
/* velo corto arriba del botón flotante: se lee que la data sigue por debajo, no que se corta */
.data>.cta.pie::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:var(--s-3);pointer-events:none;background:linear-gradient(to top,var(--bg) 40%,rgba(255,255,255,0))}
.d-cab .ey{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap}
.d-cab .ey [lang="ja"]{letter-spacing:0}
/* la nota del pintor va en renglón propio: nunca un separador colgando al principio de una línea */
.d-cab .ey .pint{flex-basis:100%;white-space:nowrap}
.d-cab .ey a{display:inline-flex;align-items:center;min-height:24px;margin-block:-4px;color:inherit;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;transition:text-decoration-color var(--dur-fast)}
.d-cab .ey a:hover,.d-cab .ey a:focus-visible{text-decoration-color:currentColor}
/* nombres MANUK con «>>» y «/» (MANUK.HOODIE/002.>>PTW WHITE): el h1 corta donde hace falta, sin desbordar ni partir a mitad de palabra */
.d-cab h1{font-family:var(--f-display);font-size:clamp(30px,2.4vw,36px);line-height:.92;text-transform:uppercase;letter-spacing:.005em;margin-top:var(--s-2);overflow-wrap:anywhere;word-break:normal;hyphens:manual;text-wrap:balance;min-width:0}
.d-cab .sellos{margin-top:var(--s-2)}
/* línea de edición veraz: «PIEZA ÚNICA · 1/1» solo si es única; si no, los talles con stock (y QUEDAN n solo si es real) */
.d-ed{margin-top:var(--s-2);font-family:var(--f-mono);font-size:var(--t-1);letter-spacing:.16em;text-transform:uppercase;color:var(--fg-2);line-height:1.6}
.d-ed b{color:var(--fg);font-weight:400}
.d-desc{margin-top:var(--s-3);font-size:var(--t-5);line-height:1.5;color:var(--fg);max-width:38ch}
.d-precio{margin-top:var(--s-3);display:flex;flex-direction:column;gap:var(--s-1)}
.d-precio .top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:var(--s-1) var(--s-3)}
.d-precio .pr{font-family:var(--f-mono);font-size:clamp(24px,1.9vw,28px);letter-spacing:-.01em;line-height:1;font-variant-numeric:tabular-nums;color:var(--fg)}
.d-precio .pago{font-family:var(--f-mono);font-size:var(--t-1);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);line-height:1.6;margin-top:var(--s-1)}
.d-precio .sku{font-family:var(--f-mono);font-size:var(--t-1);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);line-height:1.6;min-height:1.6em;min-width:0;max-width:100%}
/* SKUs largos cortan dentro de la columna (también con los glifos katakana del scramble): la página nunca gana scroll horizontal */
.d-precio .sku [aria-hidden]{white-space:pre-wrap;overflow-wrap:anywhere}

/* filas de sistema (patrón Heliot Emil 01–04): número · rótulo · contenido */
.filas{margin-top:var(--s-3);border-top:1px solid var(--line)}
.fila{display:grid;grid-template-columns:28px minmax(0,1fr);gap:var(--s-1) var(--s-3);padding:var(--s-2) 0;border-bottom:1px solid var(--line)}
.fila .no{font-family:var(--f-mono);font-size:var(--t-1);letter-spacing:.12em;color:var(--fg-2);line-height:1.6;padding-top:1px}
.fila h2{font-family:var(--f-mono);font-size:var(--t-1);letter-spacing:.18em;text-transform:uppercase;color:var(--fg);line-height:1.6}
.fila h2 [lang="ja"]{letter-spacing:0;color:var(--fg-2);margin-left:6px}
.fila .cu{grid-column:2;min-width:0;font-size:var(--t-4);line-height:1.6;color:var(--fg)}
.fila .cu p+p{margin-top:var(--s-2)}
.fila .cu .nota{color:var(--fg-2)}
.fila .cu .lnk{display:inline-flex;align-items:center;min-height:24px;margin:-4px 0}
.talle{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s-2) var(--s-3)}
.talle .lnk{margin-left:auto}
.talle b{font-family:var(--f-mono);font-size:var(--t-5);font-weight:400;letter-spacing:.06em;color:var(--fg)}
.talle span{font-family:var(--f-mono);font-size:var(--t-1);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);white-space:nowrap}
/* selector de talle (varios talles con stock): radios reales, texto plano y elegante (Demobaza: S M L XL); el elegido se subraya */
.tl-sel{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s-2) var(--s-4);margin:0;padding:0;border:0;min-width:0}
.tl-sel legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.tl-sel label{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:28px;min-height:32px;cursor:pointer}
.tl-sel input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
/* cada opción es un control: base de regla fina (se lee como casillero, no como lista); el elegido la cierra en negro */
.tl-sel label>span{display:inline-block;min-width:28px;text-align:center;font-family:var(--f-mono);font-size:var(--t-5);font-weight:400;letter-spacing:.06em;color:var(--fg-2);border-bottom:1px solid var(--line);padding-bottom:2px;transition:color var(--dur-fast),border-color var(--dur-fast)}
.tl-sel label:hover>span{color:var(--fg);border-bottom-color:var(--fg-2)}
.tl-sel input:checked+span{color:var(--fg);border-bottom-color:var(--fg)}
.tl-sel input:focus-visible+span{outline:1px solid currentColor;outline-offset:3px}
/* talles que existieron y ya no quedan (patrón Heliot Emil: agotados en gris, tachados) — decorativos sobre blanco */
.tl-sel .ag{font-family:var(--f-mono);font-size:var(--t-5);letter-spacing:.06em;color:var(--fg-3);text-decoration:line-through;text-decoration-thickness:1px;padding-bottom:3px}
.tl-sel .lnk{margin-left:auto}
.tl-sel.falta label>span{border-bottom-color:var(--fg-3)}
.tl-sel.falta label>span,.tl-sel.falta+.nota{color:var(--fg)}
.mats{display:flex;flex-direction:column;gap:var(--s-1)}
.mats li{display:flex;gap:var(--s-2);align-items:baseline}
.mats li::before{content:"";flex:0 0 5px;width:5px;height:5px;background:var(--fg);transform:translateY(-2px)}
.med{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.med th,.med td{padding:var(--s-1) 0;border-bottom:1px solid var(--line);text-align:left;font-weight:400;vertical-align:baseline}
.med tr:last-child th,.med tr:last-child td{border-bottom:0}
.med td{text-align:right;font-family:var(--f-mono);font-size:var(--t-4);letter-spacing:.04em;white-space:nowrap}
.med caption{text-align:left;font-family:var(--f-mono);font-size:var(--t-0);letter-spacing:.16em;text-transform:uppercase;color:var(--fg-2);padding-bottom:var(--s-1)}
.lava b{font-weight:500}

/* CTA único */
.cta{margin-top:var(--s-3)}
.cta .btn{gap:var(--s-3);justify-content:space-between;padding-inline:var(--s-6)}
.cta .btn .pr{font-variant-numeric:tabular-nums;letter-spacing:.06em}
/* reservada: aria-disabled (no disabled) para que el foco pueda volver al botón al cerrar el carrito */
.cta .btn[aria-disabled="true"]{justify-content:center;border-style:dashed;cursor:default}
.cta .btn[aria-disabled="true"]:hover,.cta .btn[aria-disabled="true"]:focus-visible{box-shadow:none}
.cta .btn[aria-disabled="true"]:active{transform:none}
/* región viva: siempre en el árbol (si nace display:none, varios lectores no anuncian el primer cambio) */
.cta .st{display:block;min-height:0;line-height:1.6;font-family:var(--f-mono);font-size:var(--t-1);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.cta .st:not(:empty){margin-top:var(--s-2)}
.cta-pr{display:none}

/* envío / retiro */
/* banda de servicio: tres celdas bajo el ensayo (envío · retiro · legales), una sola regla arriba */
/* la celda de links es corta y cede ancho a las dos de texto: ninguna línea se parte a mitad de frase */
.envio{margin-top:var(--s-6);display:grid;grid-template-columns:1.1fr 1.3fr auto;gap:0 var(--s-6);border-top:1px solid var(--line)}
.envio>div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:var(--s-3);padding:var(--s-4) 0;font-family:var(--f-mono);font-size:var(--t-1);letter-spacing:.14em;text-transform:uppercase;line-height:1.7;color:var(--fg-2)}
.envio>div.lk{align-items:start}
.envio>div>span:last-child{min-width:0;white-space:nowrap}
.envio b{color:var(--fg);font-weight:400}
.envio .ic{color:var(--fg);letter-spacing:0}
.envio .reloj{display:inline-flex;align-items:center;gap:var(--s-2);vertical-align:baseline}
.envio .reloj .dot{width:6px;height:6px;border:1px solid var(--fg);display:inline-block}
.envio .reloj[data-estado="abierto"] .dot{background:var(--fg)}
/* puntero fino: los links arrancan en la misma línea base que las celdas vecinas (el bloque touch les da 44px) */
.envio button{display:inline;min-height:0;padding:0;line-height:inherit;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--fg-3);color:var(--fg-2);letter-spacing:inherit;text-transform:inherit;font:inherit;transition:color var(--dur-fast),text-decoration-color var(--dur-fast)}
.envio button:hover,.envio button:focus-visible{color:var(--fg);text-decoration-color:currentColor}
.envio .links{display:flex;flex-wrap:wrap;gap:0 var(--s-3)}

/* ── COMPLETÁ EL CONJUNTO ── */
.conj{padding:var(--s-12) 0 var(--s-24);border-top:1px solid var(--line)}
.conj-h{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s-6);margin-bottom:var(--s-8)}
.conj-h h2{font-family:var(--f-display);font-size:var(--t-7);line-height:.95;text-transform:uppercase}
.conj-h .ey{text-align:right}
.conj .pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.volver{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s-4);margin-top:var(--s-16);padding-top:var(--s-8);border-top:1px solid var(--line)}
.volver .btn [lang="ja"]{letter-spacing:0;color:inherit}

/* estado: pieza inexistente */
.nada{padding:var(--s-24) 0}
.nada h1{font-family:var(--f-display);font-size:var(--t-8);line-height:.9;text-transform:uppercase;max-width:14ch}
.nada p{margin-top:var(--s-6);max-width:44ch}
.nada .acc{display:flex;flex-wrap:wrap;gap:var(--s-3);margin-top:var(--s-8)}

/* ── RESPONSIVE ── */
@media (max-width:1279px) and (min-width:1024px){
  .ficha{gap:0 var(--s-12)}
  /* columna izquierda de ~570–850px: envío y retiro a la par, los links en su propia fila */
  .envio{grid-template-columns:1fr 1fr}
  .envio>div.lk{grid-column:1 / -1;border-top:1px solid var(--line);padding-top:var(--s-3);padding-bottom:var(--s-3)}
}
/* columna compacta (la mide el JS: solo cuando cabecera → CTA no entra en el primer pantallazo — notebooks bajas
   o piezas con selector de talle + tabla larga). Primero se compacta; recién si aun así no entra, pasa a .alta */
@media (min-width:1024px) and (max-height:820px){.migas{min-height:32px;padding-top:var(--s-3)}}
@media (min-width:1024px){
  .d-stick.compacta .d-cab h1{font-size:clamp(28px,2.1vw,32px)}
  .d-stick.compacta .d-desc{margin-top:var(--s-2);font-size:var(--t-4)}
  .d-stick.compacta .d-precio,.d-stick.compacta .filas,.d-stick.compacta .cta{margin-top:var(--s-2)}
  .d-stick.compacta .fila{padding:var(--s-1) 0}
  .d-stick.compacta .fila .cu{line-height:1.5}
  .d-stick.compacta .fila .cu p+p{margin-top:var(--s-1)}
  .d-stick.compacta .mats{gap:0}
  .d-stick.compacta .med th,.d-stick.compacta .med td{line-height:1.4}
  .d-stick.compacta .d-cab .sellos{margin-top:var(--s-1)}
  .d-stick.compacta .d-precio .pago{margin-top:0}
  .d-stick.compacta .tl-sel label{min-height:28px}
}
/* touch: targets ≥44px en todos los controles propios de la página */
@media (hover:none),(pointer:coarse){
  .migas{padding-top:var(--s-2)}
  .migas a{min-height:44px}
  .tl-sel label{min-width:44px;min-height:44px}
  .tl-sel{gap:0 var(--s-2)}
  .d-cab .ey a{min-height:44px;margin-block:-14px}
  .envio button{display:inline-flex;align-items:center;min-height:44px}
  .envio>div.lk{padding:var(--s-1) 0}
  .fila .cu .lnk{min-height:44px;margin:-8px 0 -10px;flex-basis:100%;justify-content:flex-start}
}
@media (max-width:1023px){
  /* ritmo parejo de 24 entre cabecera → descripción → precio → ensayo; 32 recién antes de la data y del servicio */
  .ficha{grid-template-columns:1fr;gap:var(--s-6)}
  .izq,.data,.d-stick{display:contents}
  /* tablet: categoría → nombre → sellos → descripción → precio; después el ensayo (de a pares) y la data dura al pie.
     En teléfono (≤767, más abajo) la data dura sube: va entre la hero y el resto del ensayo. */
  .d-cab{order:1}
  .d-desc{order:2;margin-top:0}
  .d-precio{order:3;margin-top:0}
  .ensayo{order:4;margin-top:0}
  .ens-mas{order:4;margin-top:calc(var(--s-6) * -1)}
  .filas{order:5;margin-top:var(--s-2)}
  .cta{order:6}
  .envio{order:7;margin-top:var(--s-2);grid-template-columns:1fr;gap:0}
  .envio>div{padding:var(--s-3) 0;border-bottom:1px solid var(--line);line-height:1.6}
  .envio>div>span:last-child{white-space:normal}
  .envio>div.lk{align-items:center;padding:var(--s-2) 0}
  /* en tablet la data que sigue a las fotos se acomoda en dos columnas */
  .ficha{display:grid}
  .d-desc,.d-precio,.filas,.envio{max-width:640px}
  /* CTA fijo abajo (patrón Diesel): un solo botón, siempre a mano; el colchón se mide en JS (--cta-h)
     para que la barra no tape el pie del footer cuando aparece el mensaje de estado */
  html.con-cta body{padding-bottom:calc(var(--cta-h,88px) + var(--s-2))}
  .cta{position:fixed;left:0;right:0;bottom:0;z-index:90;margin:0;padding:var(--s-3) var(--gut);background:var(--bg);border-top:1px solid var(--line);
    display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s-4);align-items:center}
  .cta .btn{min-height:52px;justify-content:center;padding-inline:var(--s-4)}
  .cta .btn .pr{display:none}
  .cta-pr{display:block;font-family:var(--f-mono);font-size:var(--t-5);font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1;color:var(--fg)}
  .cta-pr small{display:block;font-size:var(--t-0);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);margin-top:4px;line-height:1.3}
  .cta{row-gap:0}
  .cta .st{grid-column:1 / -1;margin:0}
  .cta .st:not(:empty){margin:0;padding-top:var(--s-2)}
}
@media (max-width:1023px) and (min-width:768px){
  /* el botón ocupa todo el resto de la barra (no queda media barra vacía a la derecha) */
  .cta{grid-template-columns:auto minmax(0,1fr)}
  /* tarjetas de ~225px: nombre y precio apilados para que el precio no se descuelgue */
  .conj .pcard-meta{flex-direction:column;gap:2px}
}
@media (max-width:767px){
  /* teléfono: LA FOTO VA PRIMERA. Migas cortas → hero a sangre con el cuerpo entero (2:3, la proporción real
     de las fotos: sin recorte) → nombre + precio inmediatamente debajo → descripción → la data dura apilada
     (talle · materiales · medidas · cuidados: el selector de talle queda a mano del CTA fijo) → el resto del
     ensayo, cada toma a sangre y a proporción real (la foto manda: una toma enorme por pantalla, nunca hoja de

  .d-desc{order:4;margin-top:var(--s-2)}
  .filas{order:5;margin-top:var(--s-6)}
  .ens-mas{order:7;margin-top:0}
  .cta{order:8}
  .envio{order:9;margin-top:0}

  .foto.sola:first-child,.foto.sola-m:first-child{grid-column:1 / -1;width:auto;justify-self:auto;margin-inline:calc(var(--gut) * -1)}

  .d-precio .pr{font-size:clamp(22px,6vw,26px)}

}

  var esDis = !!PM.dis(p), VLAB = PM.varLabel(p), vlab = VLAB.toLowerCase();
  var tls = PM.vars(p), multi = tls.length > 1, unica = PM.esUnica(p), ultima = PM.esUltima(p), unico = !esDis && tls.length === 1 && tls[0] === 'U';

  /* cabecera */
  $('d-cat').innerHTML = '<a href="' + TERR(p.cat) + '"><b>' + esc(CATNM(p.cat)) + '</b></a>' + (p.kj ? '<span lang="ja" aria-hidden="true">' + esc(p.kj) + '</span>' : '') +
    (p.sellos && p.sellos.indexOf('手描き') > -1 ? '<span class="pint">PINTADA A MANO EN EL TALLER</span>' : '');
  $('d-nm').textContent = p.nm;
  $('d-sellos').innerHTML = PM.sellosHTML(p.sellos);
  /* «PIEZA ÚNICA · 1/1» solo si la casa la declara; «QUEDA UNA · TALLE n» si queda una; si no, los talles con stock (ver arriba) */
  $('d-ed').innerHTML = edLinea;
  $('d-desc').textContent = p.desc || '';
  if (!p.desc) $('d-desc').hidden = true;
  $('d-pr').textContent = PM.fmt(p.pr);
  /* la barra fija del teléfono solo lleva el precio: los medios de pago ya están en la columna, y acá no entra ninguna línea sin romper el CTA */
  $('cta-pr').textContent = PM.fmt(p.pr);
  var sku = $('d-sku');
  PM.scramble(sku, p.sku);
  if (PM.FINE) sku.addEventListener('pointerenter', function () { PM.scramble(sku, p.sku, { dur: 480 }); });

  /* talle de ESTA pieza: único · un solo talle con stock · selector (varios talles con stock, nomenclatura real de la casa).
     XS no existe en la casa: no se muestra nunca (ni tachado); la doctrina va en una sola línea debajo. */
  var agot = (p.tlsAgotados || []).map(String).filter(function (t) { return !/^xs$/i.test(t); });
  var talleSel = multi ? (PM.cart.talleDe(p.id) || null) : tls[0];   /* si ya está en el carrito, arranca con ese talle */
  var talleHTML;
  if (unico) talleHTML = '<p class="talle"><b>ÚNICO</b><span>SE AJUSTA AL CUERPO</span><button type="button" class="lnk" data-legal="talles">GUÍA DE TALLES</button></p>';
  /* una pieza única no «es el único talle que queda»: es su talle (sin contradecir el 1/1 de arriba) */
  else if (!multi) talleHTML = '<p class="talle"><b>' + esc(tls[0]) + '</b><span>' + (unica ? 'SU TALLE' : agot.length ? 'EL ÚNICO TALLE QUE QUEDA' : 'UN SOLO TALLE') + '</span><button type="button" class="lnk" data-legal="talles">GUÍA DE TALLES</button></p>';
  else talleHTML = '<fieldset class="tl-sel" id="tl-sel"' + (esDis ? '' : ' aria-describedby="tl-nota"') + '><legend>' + (esDis ? 'Elegí tu diseño' : 'Elegí tu talle') + '</legend>' +
    tls.map(function (t) { return '<label><input type="radio" name="talle" value="' + esc(t) + '"' + (talleSel === t ? ' checked' : '') + '><span>' + esc(t) + '</span></label>'; }).join('') +
    (esDis ? '' : agot.map(function (t) { return '<span class="ag" aria-hidden="true">' + esc(t) + '</span><span class="sr">Talle ' + esc(t) + ' agotado</span>'; }).join('')) +
    '<button type="button" class="lnk" data-legal="talles">GUÍA DE TALLES</button></fieldset>';
  /* una sola línea: «elegí el talle antes de agregar» ya lo dice el CTA (pm:talle) cuando hace falta */
  var talleNota = esDis ? 'Talle único, cozysize. El diseño que elegís es el que sale del taller.' : unico ? '' : 'No hay XS: se ajusta al cuerpo. Compará con una prenda tuya.';

  /* materiales */
  var matHTML = (p.mat && p.mat.length)
    ? '<ul class="mats">' + p.mat.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>'
    : '<p class="nota">Textil de la casa. La composición exacta va en la etiqueta interna de la pieza.</p>';

  /* medidas: las de ESTA pieza; si la casa las publica por talle, la tabla sigue al talle elegido */
  function medTabla(tl) {
    var med = (tl && p.medPorTalle && p.medPorTalle[tl]) || p.med, mt = (tl && p.medPorTalle && p.medPorTalle[tl]) ? tl : p.medTalle;
    if (!med || !med.length) return '<p class="nota">Esta pieza se mide en el taller antes de salir. Pedinos las medidas por Instagram <b>@pannimargot</b> o en Honduras 4940.</p>';
    /* sin talle elegido, la tabla no finge selección: es la referencia del talle publicado */
    return '<table class="med">' + (mt ? '<caption' + (multi ? '' : ' class="sr"') + '>Talle ' + esc(mt) + (multi && !tl ? ' · referencia' : '') + ' · en plano</caption>' : '<caption class="sr">Tomadas sobre esta pieza, en plano</caption>') + '<tbody>' +
      med.map(function (r) { return '<tr><th scope="row">' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td></tr>'; }).join('') + '</tbody></table>';
  }
  var medHTML = '<div id="med-box">' + medTabla(talleSel) + '</div>';

  /* cuidados: SOLO si la descripción real de la pieza los trae (cui sin cuiEstimado). Si no —hoy, ninguna—, la ficha no responde
     «¿se lava?» por su cuenta: remite a la etiqueta interna y a Instagram. Nada inventado por regla de material. */
  var cuiReal = p.cui && p.cuiEstimado === false ? String(p.cui) : '';
  var cuiHTML = cuiReal
    ? '<p class="lava"><b>' + esc(cuiReal) + '</b></p>'
    : '<p>Los cuidados de esta pieza van en su etiqueta interna. Cualquier duda, te la respondemos por Instagram <b>@pannimargot</b>.</p>';
  if (p.sellos && p.sellos.indexOf('手描き') > -1) cuiHTML += '<p class="nota">Pieza pintada a mano: el trazo no se repite en otra.</p>';

  $('filas').innerHTML =
    '<section class="fila"><span class="no" aria-hidden="true">01</span><h2>' + (esDis ? 'DISEÑO DE ESTA PIEZA' : multi ? 'TU TALLE' : 'TALLE DE ESTA PIEZA') + '</h2><div class="cu">' + talleHTML + (talleNota ? '<p class="nota" id="tl-nota">' + talleNota + '</p>' : '') + '</div></section>' +
    '<section class="fila"><span class="no" aria-hidden="true">02</span><h2>MATERIALES</h2><div class="cu">' + matHTML + '</div></section>' +
    '<section class="fila"><span class="no" aria-hidden="true">03</span><h2>MEDIDAS DE ESTA PIEZA</h2><div class="cu">' + medHTML + '</div></section>' +
    '<section class="fila"><span class="no" aria-hidden="true">04</span><h2>CUIDADOS</h2><div class="cu">' + cuiHTML + '</div></section>';

  /* colchón del CTA fijo (≤1023): se mide para que la barra no tape el pie del footer al aparecer el estado */
  function colchon() { d.documentElement.style.setProperty('--cta-h', (innerWidth < 1024 ? $('cta').offsetHeight : 0) + 'px'); }
  /* CTA único: agregar · en el carrito (única → reservada) */
  var b = $('add'), st = $('cta-st');
  var tlTxt = function (t) { return PM.varTxt(p, t); };
  function pintar(ev) {
    /* con varios talles, «en el carrito» es por talle elegido (podés sumar otro talle de la misma pieza) */
    var en = talleSel != null && PM.cart.has(p.id, talleSel);
    /* aria-disabled (no disabled): el botón sigue siendo focusable y el foco vuelve a él al cerrar el carrito;
       en el carrito → el click abre el carrito (la pieza ya está ahí; el listener de abajo lo resuelve) */
    b.setAttribute('aria-disabled', en ? 'true' : 'false');
    /* en el carrito: sin data-add el delegado de base.js no la captura → estado y comportamiento coinciden (4.1.2) */
    if (en) b.removeAttribute('data-add'); else b.setAttribute('data-add', p.id);
    if (talleSel != null) b.setAttribute('data-talle', talleSel); else b.removeAttribute('data-talle');
    /* el nombre accesible contiene el texto visible (2.5.3); el nombre de la pieza va en .sr */
    b.innerHTML = en
      ? '<span>' + (unica ? 'RESERVADA — ES ÚNICA' : 'EN TU CARRITO · ' + VLAB + ' ' + esc(tlTxt(talleSel))) + '<span class="sr"> · ' + esc(p.nm) + ' ya está en tu carrito</span></span>'
      : '<span>AGREGAR AL CARRITO<span class="sr"> ' + esc(p.nm) + (talleSel != null && !unico ? ' ' + vlab + ' ' + esc(tlTxt(talleSel)) : '') + '</span></span><span class="pr">:: ' + esc(PM.fmt(p.pr)) + '</span>';
    if (ev && ev.detail && ev.detail.id === p.id) {
      var msg = ev.detail.accion === 'add'
        ? (unica ? 'EN TU CARRITO :: ES UNA SOLA' : VLAB + ' ' + esc(tlTxt(ev.detail.talle || talleSel)) + ' EN TU CARRITO')
        : ev.detail.accion === 'remove' ? 'LIBERADA :: VUELVE A LA SALA' : '';
      st.textContent = msg;
      /* con el drawer abierto <main> queda inert: se anuncia también en la región viva del carrito */
      if (ev.detail.accion === 'add') { var ds = d.querySelector('#pm-cart .st'); if (ds) ds.textContent = msg; }
    }
    if (ev && ev.detail && ev.detail.accion === 'clear') st.textContent = '';
    colchon();
  }
  pintar(); d.addEventListener('pm:cart', pintar);
  /* selector de talle: cambia el talle del CTA y la tabla de medidas */
  var sel = $('tl-sel');
  if (sel) sel.addEventListener('change', function (e) {
    if (!e.target || e.target.name !== 'talle') return;
    talleSel = e.target.value; sel.classList.remove('falta'); st.textContent = '';
    var mb = $('med-box'); if (mb) mb.innerHTML = medTabla(talleSel);
    pintar();
  });
  /* sin talle elegido (base.js no adivina): se pide el talle y el foco va al selector */
  d.addEventListener('pm:talle', function (e) {
    if (!e.detail || e.detail.id !== p.id) return;
    var msg = e.detail.motivo === 'sin-stock' ? (esDis ? 'ESE DISEÑO YA NO QUEDA :: ELEGÍ OTRO' : 'ESE TALLE YA NO QUEDA :: ELEGÍ OTRO') : 'ELEGÍ TU ' + VLAB + ' :: ' + tls.join(' · ').toUpperCase();
    st.textContent = msg;
    if (sel) { sel.classList.add('falta'); var r = sel.querySelector('input'); if (r) r.focus(); }
    colchon();
  });
  /* EN EL CARRITO: sin data-add el delegado de base.js no responde; el click muestra dónde está la pieza */
  b.addEventListener('click', function () {
    if (b.getAttribute('aria-disabled') !== 'true') return;
    var msg = unica ? 'YA ESTÁ EN TU CARRITO :: ES UNA SOLA' : 'YA ESTÁ EN TU CARRITO :: ' + VLAB + ' ' + tlTxt(talleSel);
    st.textContent = msg;
    /* el carrito abierto deja <main> inert: se anuncia también en la región viva del drawer */
    var ds = d.querySelector('#pm-cart .st'); if (ds) ds.textContent = msg;
    colchon();
    PM.cart.open();
  });
  /* otra pestaña agregó/quitó la pieza: el header ya se actualiza vía storage; el CTA también */
  try { addEventListener('storage', function (e) { if (e.key === 'pm_cart') pintar(); }); } catch (e) {}

  /* envío / retiro */
  $('envio').innerHTML =
    /* quiebres explícitos, sin separadores colgantes; el plazo de despacho no está en el brief: no se promete */
    '<div><span class="ic" aria-hidden="true">&gt;&gt;</span><span><b>ENVÍO A TODO EL PAÍS</b><br>CON SEGUIMIENTO<br>SALE DESDE LA BOUTIQUE</span></div>' +
    '<div><span class="ic" aria-hidden="true">##</span><span><b>RETIRO SIN CARGO · HONDURAS 4940</b><br>LUN — SÁB · 11:00 — 19:00<br><span class="reloj" id="f-reloj"></span></span></div>' +
    '<div class="lk"><span class="ic" aria-hidden="true">::</span><span class="links"><button type="button" data-legal="envios">ENVÍOS</button><button type="button" data-legal="cambios">CAMBIOS</button><button type="button" data-legal="arrepentimiento">ARREPENTIMIENTO</button></span></div>';
  PM.reloj($('f-reloj'));

  $('ficha').hidden = false;

  /* bloque sticky (cabecera → CTA): si es más alto que la ventana (notebooks bajas), la columna corre con la
     página y el CTA sale del bloque para pegarse solo al pie de la ventana (siempre a mano, sin scrollear).
     El orden de lectura no cambia: el CTA sigue después de cuidados. */
  var data = $('data'), cta = $('cta'), col = data.parentNode;
  function medir() {
    if (innerWidth < 1024) {
      data.classList.remove('alta', 'compacta');
      if (cta.parentNode !== data) { cta.classList.remove('pie'); data.appendChild(cta); }
      colchon(); return;
    }
    var hd = parseFloat(getComputedStyle(d.documentElement).getPropertyValue('--hd')) || 72;
    var alto = function () { return data.offsetHeight + (cta.parentNode === data ? 0 : cta.offsetHeight); };
    var cabe = function () { return alto() <= innerHeight - hd - 48; };
    /* escalones: natural → compacta (tipos y aire un punto más cortos) → alta (la columna corre y solo el CTA se pega) */
    data.classList.remove('compacta');
    var alta = !cabe();
    if (alta) { data.classList.add('compacta'); alta = !cabe(); }
    data.classList.toggle('alta', alta);
    if (alta && cta.parentNode !== col) { cta.classList.add('pie'); col.appendChild(cta); }
    else if (!alta && cta.parentNode !== data) { cta.classList.remove('pie'); data.appendChild(cta); }
    colchon();
  }
  medir(); addEventListener('resize', medir, { passive: true });
  if (d.fonts && d.fonts.ready) d.fonts.ready.then(medir);

  /* papel de calco: sigue al puntero sobre el ensayo (solo puntero fino, sin RM) */
  var cal = $('calco'), calN = $('calco-n');
  if (PM.FINE && !PM.RM && cal) {
    var mx = 0, my = 0, cx = 0, cy = 0, run = false, over = null;
    function loop() {
      cx += (mx - cx) * .22; cy += (my - cy) * .22;
      cal.style.transform = 'translate3d(' + (cx - 120) + 'px,' + (cy - 85) + 'px,0)';
      if (Math.abs(mx - cx) + Math.abs(my - cy) > .3) requestAnimationFrame(loop); else run = false;
    }
    ens.addEventListener('pointermove', function (e) {
      var r = ens.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top;
      var f = e.target.closest ? e.target.closest('.foto') : null;
      if (f !== over) { over = f; if (f) calN.textContent = (f.dataset.i < 10 ? '0' : '') + f.dataset.i + ' / ' + (N < 10 ? '0' : '') + N; }
      cal.classList.toggle('on', !!f);
      if (!run) { run = true; requestAnimationFrame(loop); }
    }, { passive: true });
    ens.addEventListener('pointerleave', function () { cal.classList.remove('on'); over = null; });
  }

  /* completá el conjunto */
  var comp = (p.comp || []).map(PM.byId).filter(function (x) {
    return x && x.id !== p.id && !(C.archivo || []).some(function (a) { return a.id === x.id; });
  }).slice(0, 3);
  if (comp.length) {
    /* en teléfono la grilla es de 2 y la tercera tarjeta no se pinta (CSS): el eyebrow cuenta lo que se ve */
    var mqTel = window.matchMedia ? matchMedia('(max-width:767px)') : null;
    var pintarEy = function () {
      var n = mqTel && mqTel.matches ? Math.min(comp.length, 2) : comp.length;
      $('conj-ey').innerHTML = n + (n === 1 ? ' PIEZA · OTRA CATEGORÍA · ' : ' PIEZAS · OTRAS CATEGORÍAS · ') + '<b>DE A UNA, DE A POCAS — NUNCA EN SERIE</b>';
    };
    pintarEy();
    if (mqTel) { if (mqTel.addEventListener) mqTel.addEventListener('change', pintarEy); else if (mqTel.addListener) mqTel.addListener(pintarEy); }
    $('conj-grid').innerHTML = comp.map(function (x) { return PM.pcardHTML(x, { cat: false }); }).join('');
  } else {
    /* sin complementos en venta: queda solo el «volver» (nada de h2 con grilla vacía) */
    $('conj-t').closest('.conj-h').hidden = true; $('conj-grid').hidden = true;
    $('conj').removeAttribute('aria-labelledby'); $('conj').setAttribute('aria-label', 'Seguir mirando');
    $('volver').style.cssText = 'margin-top:0;padding-top:0;border-top:0';
  }
  $('volver').innerHTML =
    '<a class="btn" href="' + TERR(p.cat) + '">&lt;&lt; VOLVER A ' + esc(CATNM(p.cat)) + (p.kj ? ' <span lang="ja" aria-hidden="true">' + esc(p.kj) + '</span>' : '') + '</a>' +
    '<a class="lnk" href="./shop.html">TODO EL SHOP <span lang="ja" aria-hidden="true">店</span></a>';
  $('conj').hidden = false;
})();
</script>



<script id="pmgate-js">
/* Cortina de acceso. Recuerda el ingreso por dispositivo. */
(function(){
  var H='d5600e28005cacbad0d820784e3f9f75220b38689e9c7e16bda6513d11c3443e', K='pm_gate_ok';
  var g=document.getElementById('pmgate');
  if(!g) return;
  var root=document.documentElement;
  var f=document.getElementById('pmgate-f'), i=document.getElementById('pmgate-i'), e=document.getElementById('pmgate-e');
  var RM=matchMedia('(prefers-reduced-motion:reduce)').matches;

  function abrir(){
    root.classList.remove('pmgate-lock');
    if(RM){ g.remove(); return; }
    g.classList.add('pmgate--out');
    setTimeout(function(){ g.remove(); }, 480);
  }

  if(root.classList.contains('pmgate-ok')){ g.remove(); return; }
  try{ if(localStorage.getItem(K)===H){ abrir(); return; } }catch(err){}

  root.classList.add('pmgate-lock');
  setTimeout(function(){ try{ i.focus(); }catch(err){} }, 60);

  async function sha(txt){
    var b=new TextEncoder().encode(txt);
    var d=await crypto.subtle.digest('SHA-256', b);
    return Array.from(new Uint8Array(d)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
  }

  f.addEventListener('submit', async function(ev){
    ev.preventDefault();
    var v=i.value;
    if(!v){ e.textContent=''; i.focus(); return; }
    var h;
    try{ h=await sha(v); }catch(err){ e.textContent='[ !! ] SIN CONEXIÓN SEGURA'; return; }
    if(h===H){
      try{ localStorage.setItem(K,H); }catch(err){}
      e.textContent='[ OK ]';
      abrir();
    }else{
      e.textContent='[ !! ] NO';
      i.value=''; i.focus();
    }
  });

  /* El foco no sale del portón mientras esté cerrado. */
  g.addEventListener('keydown', function(ev){
    if(ev.key!=='Tab') return;
    var f2=g.querySelectorAll('input,button');
    if(!f2.length) return;
    var pri=f2[0], ult=f2[f2.length-1];
    if(ev.shiftKey && document.activeElement===pri){ ev.preventDefault(); ult.focus(); }
    else if(!ev.shiftKey && document.activeElement===ult){ ev.preventDefault(); pri.focus(); }
  });
})();
</script>
